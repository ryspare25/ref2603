<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Book Iterator Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <!-- (styles unchanged) -->
</head>
<body>
  <!-- (HTML structure unchanged) -->

  <script>
    /* =========================================================
       CONFIG
       ========================================================= */

    const CONFIG = {
      books: [
        {
          startUrl: "https://ryspare25.github.io/ref2603/view-now.html?fileName=dictators-handbook.pdf&page=8",
          endUrl:   "https://ryspare25.github.io/ref2603/view-now.html?fileName=dictators-handbook.pdf&page=329"
        },
        {
          startUrl: "https://ryspare25.github.io/ref2603/view-now.html?fileName=mein-kampf.pdf&page=14",
          endUrl:   "https://ryspare25.github.io/ref2603/view-now.html?fileName=mein-kampf.pdf&page=788"
        },
        {
          startUrl: "https://ryspare25.github.io/ref2603/view-now.html?fileName=the-prince-1-133.pdf&page=16",
          endUrl:   "https://ryspare25.github.io/ref2603/view-now.html?fileName=the-prince-1-133.pdf&page=133"
        },
      ],
      seenRollChance: 0.33
    };

    /* =========================================================
       (ALL ORIGINAL CODE UNCHANGED)
       ========================================================= */

    function rollCurrent(){
      // Current scheduled stop always becomes seen before roll resolution
      markSeen(state.cursor);

      const currentIndex = state.cursor;
      const targetIndex = getRollTargetIndex();
      const targetIter = getIterationAt(targetIndex);

      // Determine type
      const isReview = targetIndex !== currentIndex;
      const typeParam = isReview ? "Review" : "New";

      // If the roll landed on a seen-random target, also keep that recorded
      markSeen(targetIndex);
      saveState();
      render();

      // Attach type param
      const url = new URL(targetIter.url);
      url.searchParams.set("type", typeParam);

      window.location.href = url.toString();
    }

    /* =========================================================
       (REST OF ORIGINAL SCRIPT UNCHANGED)
       ========================================================= */
  </script>
</body>
</html>
