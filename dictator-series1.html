<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Book Iterator Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <style>
    :root{
      --bg:#0b0c10; --fg:#cfd8dc; --muted:#90a4ae; --accent:#7cb342;
      --btn:#263238; --btn-hover:#37474f; --btn-active:#455a64; --danger:#e53935;
      --border:#1b2328; --card:#11161a; --panel:#0f1519; --panel2:#0c1114;
      --ok:#1c313a; --okfg:#b2dfdb;
    }

    html, body {
      margin:0; padding:0; background:var(--bg); color:var(--fg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      min-height:100svh;
    }

    .hidden{display:none!important;}
    .small{color:var(--muted); font-size:.92rem;}

    main{
      margin: 1rem auto;
      width:min(100%, 980px);
      padding: 0 .8rem 2rem;
      box-sizing:border-box;
    }

    .paper{
      background:var(--card); color:var(--fg);
      border-radius: 18px;
      box-shadow:0 20px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.05) inset;
      padding: 1rem;
    }

    .toolbar{
      display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; justify-content:flex-end;
    }

    .btn{
      border:1px solid #111; background:var(--btn); color:var(--fg);
      padding:.75rem 1rem; border-radius:.7rem; font-size:1rem; cursor:pointer;
      transition: transform .05s ease, background .15s ease, box-shadow .15s ease;
      box-shadow:0 2px 0 rgba(0,0,0,.3); user-select:none; text-decoration:none;
      min-height: 48px;
      font-weight: 650;
    }

    .btn:hover{background:var(--btn-hover);}
    .btn:active{transform:translateY(1px); background:var(--btn-active);}
    .btn[disabled]{opacity:.5; cursor:not-allowed;}
    .btn-accent{background:var(--accent); color:#0b0c10; border-color:#5a8e2f;}
    .btn-danger{background:var(--danger); color:#fff; border-color:#b71c1c;}
    .btn-ghost{background:transparent;}
    .btn-small{padding:.6rem .9rem; font-size:.96rem; border-radius:.6rem;}
    .btn-outline{
      background:transparent; border-color:var(--border); color:var(--fg);
    }
    .btn-outline:hover{background:#0f1519;}

    h1{
      margin:.25rem 0 .35rem 0;
      font-weight:750;
      font-size:1.3rem;
      line-height:1.2;
    }

    .lead{ margin:.25rem 0 1rem 0; }
  </style>
</head>
<body>
  <main>
    <section class="paper">
      <header style="display:flex; justify-content:space-between;">
        <h1>Book Iterator Viewer</h1>
        <div class="toolbar">
          <a href="./" class="btn btn-ghost btn-small">↻ Reload</a>
        </div>
      </header>

      <button id="rollBtn" class="btn btn-accent">🎲 Roll</button>
    </section>
  </main>

  <script>
    const CONFIG = {
      books: [
        {
          startUrl: "https://ryspare25.github.io/ref2603/view-now.html?fileName=dictators-handbook.pdf&page=8",
          endUrl:   "https://ryspare25.github.io/ref2603/view-now.html?fileName=dictators-handbook.pdf&page=329"
        }
      ],
      seenRollChance: 0.33
    };

    let state = {
      cursor: 0,
      seenIndices: [0]
    };

    function secureRandom01(){
      const arr = new Uint32Array(1);
      crypto.getRandomValues(arr);
      return arr[0] / 0xffffffff;
    }

    function pickRandom(arr){
      return arr[Math.floor(secureRandom01() * arr.length)];
    }

    function getIterationAt(index){
      return {
        url: CONFIG.books[0].startUrl
      };
    }

    function getRollTargetIndex(){
      const currentIndex = state.cursor;
      const seenPool = state.seenIndices;

      const shouldUseSeen =
        seenPool.length > 0 &&
        secureRandom01() < CONFIG.seenRollChance;

      if(shouldUseSeen){
        return { index: pickRandom(seenPool), isReview: true };
      }

      return { index: currentIndex, isReview: false };
    }

    function rollCurrent(){
      const roll = getRollTargetIndex();
      const targetIter = getIterationAt(roll.index);

      const url = new URL(targetIter.url);
      url.searchParams.set("type", roll.isReview ? "Review" : "New");

      window.location.href = url.toString();
    }

    document.getElementById("rollBtn").addEventListener("click", rollCurrent);
  </script>
</body>
</html>
