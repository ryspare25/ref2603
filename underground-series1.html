<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Book Iterator Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <style>
    :root{
      --bg:#0b0c10; --fg:#cfd8dc; --muted:#90a4ae; --accent:#7cb342;
      --btn:#263238; --btn-hover:#37474f; --btn-active:#455a64; --danger:#e53935;
      --border:#1b2328; --card:#11161a; --panel:#0f1519; --panel2:#0c1114;
      --ok:#1c313a; --okfg:#b2dfdb;
    }
    html, body {
      margin:0; padding:0; background:var(--bg); color:var(--fg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      min-height:100svh;
    }
    .hidden{display:none!important;}
    .small{color:var(--muted); font-size:.92rem;}
    main{
      margin: 1rem auto;
      width:min(100%, 980px);
      padding: 0 .8rem 2rem;
      box-sizing:border-box;
    }
    .paper{
      background:var(--card);
      border-radius: 18px;
      box-shadow:0 20px 60px rgba(0,0,0,.5);
      padding: 1rem;
    }
    .btn{
      border:1px solid #111; background:var(--btn); color:var(--fg);
      padding:.75rem 1rem; border-radius:.7rem; cursor:pointer;
    }
    .btn-accent{background:var(--accent); color:#0b0c10;}
  </style>
</head>
<body>
  <main>
    <section class="paper">
      <h1>Book Iterator Viewer</h1>
      <div>
        <button id="rollBtn" class="btn btn-accent">🎲 Roll</button>
      </div>
    </section>
  </main>

  <script>
    const CONFIG = {
      books: [
        {
          startUrl: "https://ryspare25.github.io/ref2603/view-now.html?fileName=notes-from-underground.pdf&page=20",
          endUrl:   "https://ryspare25.github.io/ref2603/view-now.html?fileName=notes-from-underground.pdf&page=116"
        }
      ],
      seenRollChance: 0.33
    };

    let state = {
      cursor: 0,
      seenIndices: [0]
    };

    function secureRandom01(){
      const arr = new Uint32Array(1);
      crypto.getRandomValues(arr);
      return arr[0] / 0xffffffff;
    }

    function pickRandom(arr){
      return arr[Math.floor(secureRandom01() * arr.length)];
    }

    function getRollTargetIndex(){
      const currentIndex = state.cursor;
      const seenPool = state.seenIndices;

      const shouldUseSeen =
        seenPool.length > 0 &&
        secureRandom01() < CONFIG.seenRollChance;

      if(shouldUseSeen){
        return pickRandom(seenPool);
      }
      return currentIndex;
    }

    function getIterationAt(index){
      const book = CONFIG.books[0];
      const url = new URL(book.startUrl);
      return {
        url: url.toString()
      };
    }

    /* =========================
       ✅ FIX APPLIED HERE
       ========================= */
    function rollCurrent(){
      const currentIndex = state.cursor;
      const targetIndex = getRollTargetIndex();
      const targetIter = getIterationAt(targetIndex);

      const isReview = targetIndex !== currentIndex;
      const typeParam = isReview ? "Review" : "New";

      const url = new URL(targetIter.url);
      url.searchParams.set("type", typeParam);

      window.location.href = url.toString();
    }

    document.getElementById("rollBtn")
      .addEventListener("click", rollCurrent);
  </script>
</body>
</html>
